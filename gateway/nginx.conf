server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/catalogo/ {
        proxy_pass http://catalogo:5000/;
    }

    location /api/inventario/ {
        proxy_pass http://inventario:5000/;
    }

    location /api/clientes {
        proxy_pass http://clientes:5000/clientes;
    }

    location /api/pedidos {
        proxy_pass http://pedidos:5000/pedidos;
    }

    location /api/reportes/ {
        proxy_pass http://reportes:5000/reportes/;
    }
}